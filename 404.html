<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 &ndash; Page Not Found | EdTech</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to EdTech's homepage." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 28px;
      position: relative;
      overflow: hidden;
    }

    .error-glow {
      position: absolute;
      width: 500px;
      height: 400px;
      border-radius: 50%;
      background: var(--clr-orange);
      filter: blur(180px);
      opacity: 0.06;
      pointer-events: none;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .error-code {
      font-size: clamp(100px, 20vw, 200px);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 1;
      background: linear-gradient(135deg, var(--clr-orange), #ff9a6c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
      position: relative;
    }

    .error-desc {
      font-size: 16px;
      color: var(--clr-muted);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 40px;
      position: relative;
    }

    .error-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
    }
  </style>
</head>

<body>
  <main class="error-page">
    <div class="error-glow"></div>
    <div class="error-code">404</div>
    <h1 class="error-title">This page doesn&rsquo;t exist</h1>
    <p class="error-desc">
      The link you followed may be broken, or the page may have been removed.
      Let&rsquo;s get you back on track.
    </p>
    <div class="error-actions">
      <a href="/" class="btn-primary" id="error-home-btn">
        Back to Home
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </a>
      <a href="/#contact" class="btn-ghost" id="error-contact-btn">Contact Us</a>
    </div>
  </main>
</body>

</html>
